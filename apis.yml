aid: aessenseholding
name: AEssenseGrows
description: >-
  AEssenseGrows is the operating brand of AEssense Corporation (held as AEssense
  Holding), a precision agtech manufacturer founded in Silicon Valley in 2014 by
  Robert Chen and headquartered at 205 E Alma Ave, San Jose, California, with a
  second facility in Jiading, Shanghai. It designs and builds fully automated
  zero-soil aeroponic SmartFarms for commercial indoor growers — the modular,
  stackable AEtrium-2.1 cloning and vegging system, the AEtrium-4 and Double
  Deck AEtrium-4 bloom systems, the compact Nursery-6, and the AEtrium Automated
  Dosing Unit — together with the AExcel, Aerix, AEdge and Blaze LED and
  horticultural lighting lines and a design-build-test-train-transfer consulting
  practice. The hardware is wired with a blanket of precision sensors and driven
  by Guardian Grow Manager, the company's own control software, which automates
  nutrient dosing, irrigation, photoperiod, pH, CO2, humidity and temperature
  against customer-authored Grow Plan recipes, logs and analyzes the resulting
  grow data, and offers remote access and alerting from any browser. A second
  brand, AEssenseFresh (aessensefresh.com), takes the same platform to leafy
  greens and fresh produce; the cannabis line has been licensed to integrate
  California's Metrc seed-to-sale system, which makes Guardian a consumer of a
  third-party regulatory API rather than a producer of one. AEssenseGrows
  operates no public developer program: there is no developer portal, no API
  reference, no OpenAPI, AsyncAPI, GraphQL SDL or Postman collection, no
  first-party SDK on any package registry, and no GitHub organization. Guardian
  ships only as an end-user product bundled with the hardware it controls, and
  the public Technical Document Library is product brochures and UL/CE
  datasheets in PDF. Customer documentation beyond that sits behind a Grow
  Partner Portal private-access request form.
